    # Hub-Seiten als absolute URLs. Die Website selbst verlinkt intern relativ,
    # aber Folien und QR-Codes brauchen vollstaendige Adressen. Wer eine Seite
    # umbenennt, aendert sie hier einmal, dann ziehen Folien und QR-Codes nach.
    hub:                 "https://hannesdiemerling.github.io/Frequent-Reformation/"
    hub_workshops:       "https://hannesdiemerling.github.io/Frequent-Reformation/workshops/"
    # Folien. Jedes Deck hat ein eigenes Verzeichnis, die Adressen kommen ohne
