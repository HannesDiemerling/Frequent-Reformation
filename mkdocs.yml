site_name: Beyond p-values
site_description: Workshops, Methoden und Wissen für eine bessere Forschungspraxis. Effektgrößen, Repräsentativität und bayesianisches Denken, verständlich erklärt.
site_url: https://hannesdiemerling.github.io/Frequent-Reformation/
site_author: HMU Health and Medical University Erfurt

# Snippets (z. B. das Glossar) sind keine eigenen Seiten.
exclude_docs: |
  _includes/
  _data/

theme:
  name: material
  language: de
  logo: assets/P.svg
  favicon: assets/P.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark Mode aktivieren
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light Mode aktivieren
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs                # Tabs-Leiste anzeigen
    # bewusst NICHT: navigation.tabs.sticky  -> Tabs scrollen mit Inhalt weg
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
    # bewusst NICHT: header.autohide  -> Header (mit Titel) bleibt immer sichtbar
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - macros:
      include_dir: docs/_includes

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

