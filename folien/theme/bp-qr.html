<!--
QR-Code oben rechts, einer pro Deck, Inhalt je Folie.

Reveal setzt den logo-Slot genau einmal fuer das ganze Deck und positioniert ihn
im Viewport, waehrend Folieninhalte in der skalierten .slides-Ebene liegen. Ein
zweiter QR-Code im Folieninhalt kann den ersten deshalb nicht sauber verdecken,
er landet daneben.

Loesung: es gibt nur ein QR-Element, das des logo-Slots. Dieses Skript

  1. haengt es in einen Link, sodass ein Klick die Zielseite in einem neuen Tab
     oeffnet, als zweiter Weg neben dem Scannen,
  2. tauscht Bild, Ziel und Beschriftung bei jedem Folienwechsel aus.

Gesteuert wird das ueber die Attribute der Folie:

  ## Ueberschrift {data-qr="hub_pwerte" data-qr-cap="Probleme des p-Werts"}

Ohne data-qr zeigt die Folie den Deck-Standard aus dem logo-Feld im Frontmatter.
Die Zuordnung Schluessel zu Adresse steht in window.BP_QR_URLS, erzeugt von
gen-assets.py aus mkdocs.yml. Faellt das Skript aus, bleibt der Standard-QR
sichtbar, nur eben nicht klickbar.

Groesse und Position: die Custom Properties --bp-qr-* in theme/bp-slides.scss.
-->
<script>
  (function () {
    function init() {
      if (!window.Reveal || typeof window.Reveal.on !== "function") {
        return setTimeout(init, 50);
      }

      var logo = document.querySelector(".reveal .slide-logo");
      if (!logo) return;

      // Der Standard-QR aus dem logo-Feld liefert gleich das Basisverzeichnis
      // der QR-Codes mit. So funktioniert das Skript unabhaengig davon, wie tief
      // das Deck im Verzeichnisbaum liegt.
      var fallbackSrc = logo.getAttribute("src");
      var base = fallbackSrc.replace(/[^/]+$/, "");
      var fallbackKey = fallbackSrc.replace(/^.*\//, "").replace(/\.svg$/, "");
      var urls = window.BP_QR_URLS || {};

      // QR in einen Link haengen, falls das nicht schon passiert ist.
      var link = logo.closest("a.bp-qr-link");
      if (!link) {
        link = document.createElement("a");
        link.className = "bp-qr-link";
        link.target = "_blank";
        link.rel = "noopener";
        // Reveal soll den Link nicht als Vorschau-Overlay abfangen.
        link.setAttribute("data-preview-link", "false");
        logo.parentNode.insertBefore(link, logo);
        link.appendChild(logo);
      }

      var caption = document.createElement("div");
      caption.className = "bp-qr-cap";
      caption.style.display = "none";
      link.parentNode.insertBefore(caption, link.nextSibling);

      function update() {
        var slide = window.Reveal.getCurrentSlide();
        if (!slide) return;

        // Vertikale Unterfolien erben den QR ihrer Sektion, falls sie keinen
        // eigenen setzen.
        var key = slide.getAttribute("data-qr");
        var cap = slide.getAttribute("data-qr-cap");
        if (!key && slide.parentElement && slide.parentElement.tagName === "SECTION") {
          key = slide.parentElement.getAttribute("data-qr");
          cap = cap || slide.parentElement.getAttribute("data-qr-cap");
        }

        logo.setAttribute("src", key ? base + key + ".svg" : fallbackSrc);

        var url = urls[key || fallbackKey];
        if (url) {
          link.setAttribute("href", url);
          link.removeAttribute("aria-hidden");
          link.style.pointerEvents = "";
        } else {
          link.removeAttribute("href");
          link.style.pointerEvents = "none";
        }
        link.setAttribute(
          "title",
          cap ? cap + ", in neuem Tab öffnen" : "Zielseite in neuem Tab öffnen"
        );

        caption.textContent = cap || "";
        caption.style.display = cap ? "block" : "none";
      }

      window.Reveal.on("ready", update);
      window.Reveal.on("slidechanged", update);
      update();
    }

    init();
  })();
</script>
