project:
  title: "Beyond p-values, Folien"
  # Innerhalb des Projekts rendern. Ein output-dir ausserhalb (etwa
  # ../docs/folien) funktioniert zwar, aber Quarto warnt dann bei jedem Lauf und
  # raeumt alte Dateien nicht auf. Der Kopierschritt nach docs/folien passiert
  # deshalb explizit, siehe .github/workflows/deploy.yml.
  output-dir: _site
  # Ein Verzeichnis je Deck, damit die Adressen ohne .html auskommen:
  # /folien/ueber/, /folien/power/ usw. Eine einzelne Folie ist unter
  # /folien/ueber/#/7 direkt erreichbar.
  render:
    - index.qmd
    - ueber/index.qmd
    - ueber-kurz/index.qmd
    - power/index.qmd
    - reliability/index.qmd
    - thinking/index.qmd

# Erzeugt von gen-assets.py aus mkdocs.yml. Liefert links.*, workshops.*,
# ch.*, contact.* und questions.* als {{< meta ... >}} in jede Folie.
# Kein https:// gehoert in eine .qmd, alle Ziele kommen von hier.
metadata-files:
  - _data.yml

# Die QR-Codes werden per Skript in den logo-Slot getauscht, nicht als
# Markdown-Bild referenziert. Deshalb muessen sie hier explizit als Ressource
# angemeldet werden, sonst kopiert Quarto sie nicht mit.
resources:
  - assets/qr

lang: de

format:
  revealjs:
    theme: [default, theme/bp-slides.scss]
    width: 1280
    height: 720
    margin: 0.06

    # _daten.html wird von gen-assets.py erzeugt und liefert die Adressen.
    # bp-qr.html tauscht den QR-Code oben rechts je Folie aus und macht ihn
    # klickbar, bp-nav.html baut die kleine Leiste unten links.
    # Reihenfolge zaehlt: die Daten muessen vor den Skripten stehen.
    include-after-body:
      - _daten.html
      - theme/bp-qr.html
      - theme/bp-nav.html

    # Bewusst NICHT embed-resources: true. Das Chalkboard-Plugin ist mit
    # self-contained-Ausgabe unvereinbar, und Live-Annotation ist in einer
    # zweistuendigen Session mehr wert als eine einzelne HTML-Datei. Jedes Deck
    # bekommt daher ein <name>_files-Verzeichnis daneben. Offline laeuft es
    # weiterhin, dann muss der ganze Ordner mit.
    embed-resources: false

    # Navigation und Vortragswerkzeuge
    slide-number: "c/t"
    hash-type: number
    progress: true
    controls: true
    touch: true
    menu:
      numbers: true
    # Tafel zum Annotieren: b oeffnet sie, c aktiviert den Stift.
    chalkboard: true

    # Ein Link auf eine Hub-Seite oeffnet sich als Overlay im Vortrag, ohne
    # den Praesentationsmodus zu verlassen. Kern der Website-Verzahnung.
    preview-links: true

    # Reveal laedt Iframes fuer die naechste Folie mit vor. Genau eine Folie
    # Vorlauf ist gewollt: die Shinylive-Apps brauchen bis zu 30 Sekunden zum
    # Starten, mehrere Pyodide-Instanzen parallel wuerden den Rechner ausbremsen.
    view-distance: 2

    center: false
    auto-stretch: false
    transition: fade
    background-transition: fade
    transition-speed: fast
    incremental: false
    fig-align: center
    link-external-icon: false
    history: true
